name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q HorseCart.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -f HorseCart/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: HorseCart-jar
          path: HorseCart/target/*.jar
